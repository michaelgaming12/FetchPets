name: Feature request
description: Suggest an idea for FetchPets.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like FetchPets to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you or your server?
    validations:
      required: false
